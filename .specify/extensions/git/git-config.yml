# Git Extension Configuration for Spec Kit
# Controls auto-commit behavior after Spec Kit commands

auto_commit:
  # Global default — applies to any event not explicitly configured
  default: false

  # Specify phase: creates spec.md
  after_specify:
    enabled: true
    message: "[Spec Kit] Add specification"

  # Plan phase: creates plan.md
  after_plan:
    enabled: true
    message: "[Spec Kit] Add implementation plan"

  # Tasks phase: creates tasks.md
  after_tasks:
    enabled: true
    message: "[Spec Kit] Add task breakdown"

  # Analyze phase: validates consistency across artifacts
  after_analyze:
    enabled: true
    message: "[Spec Kit] Add analysis report"

  # Implement phase: generates code changes
  after_implement:
    enabled: true
    message: "[Spec Kit] Implement changes"

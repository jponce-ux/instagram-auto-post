{% extends "base.html" %}

{% block title %}App - Mi App{% endblock %}

{% block content %}
<div class="flex h-screen bg-gray-50">
    <!-- Sidebar (desktop: always visible, mobile: slide-out drawer) -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 w-64 bg-white border-r border-gray-200 transform -translate-x-full transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0 flex flex-col">
        <!-- Sidebar Header -->
        <div class="flex items-center justify-between h-16 px-6 border-b border-gray-200">
            <a href="/dashboard" class="text-xl font-bold text-gray-900">Mi App</a>
            <!-- Mobile close button -->
            <button id="close-sidebar-btn" class="lg:hidden text-gray-500 hover:text-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
            <a href="/dashboard"
               hx-get="/dashboard"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="nav-item sidebar-nav-item flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors {% if request.url.path == '/dashboard' %}bg-purple-50 text-purple-700{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}"
               aria-current="{% if request.url.path == '/dashboard' %}page{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
                Dashboard
            </a>

            <a href="/dashboard/schedule"
               hx-get="/dashboard/schedule"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="nav-item sidebar-nav-item flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors {% if request.url.path == '/dashboard/schedule' %}bg-purple-50 text-purple-700{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}"
               aria-current="{% if request.url.path == '/dashboard/schedule' %}page{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                </svg>
                Agenda
            </a>

            <a href="/dashboard/automation"
               hx-get="/dashboard/automation"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="nav-item sidebar-nav-item flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors {% if request.url.path == '/dashboard/automation' %}bg-purple-50 text-purple-700{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}"
               aria-current="{% if request.url.path == '/dashboard/automation' %}page{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                Automation
            </a>

            <a href="/dashboard/analytics"
               hx-get="/dashboard/analytics"
               hx-target="#main-content"
               hx-swap="innerHTML"
               hx-push-url="true"
               class="nav-item sidebar-nav-item flex items-center px-4 py-3 text-sm font-medium rounded-lg transition-colors {% if request.url.path == '/dashboard/analytics' %}bg-purple-50 text-purple-700{% else %}text-gray-600 hover:bg-gray-100 hover:text-gray-900{% endif %}"
               aria-current="{% if request.url.path == '/dashboard/analytics' %}page{% endif %}">
                <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                Analytics
            </a>
        </nav>

        <!-- Sidebar Footer -->
        <div class="p-4 border-t border-gray-200">
            <div class="flex items-center justify-between text-xs text-gray-500">
                <span>v1.0</span>
                <a href="/auth/logout" class="hover:text-gray-700 transition-colors">Logout</a>
            </div>
        </div>
    </aside>

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 z-20 bg-black bg-opacity-50 hidden lg:hidden" onclick="closeMobileSidebar()"></div>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col min-w-0">
        <!-- Top Bar -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
            <div class="flex items-center justify-between h-16 px-4 sm:px-6 lg:px-8">
                <!-- Mobile hamburger button -->
                <button id="hamburger-btn" class="lg:hidden text-gray-500 hover:text-gray-700 p-2 rounded-lg hover:bg-gray-100 transition-colors" onclick="openMobileSidebar()">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Page title placeholder (can be set by child pages) -->
                <div class="hidden lg:block"></div>

                <!-- User menu -->
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center">
                            <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/>
                            </svg>
                        </div>
                        <span class="hidden sm:block text-sm font-medium text-gray-700">{{ user.email }}</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-auto">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<style>
/* Active navigation state styling */
.sidebar-nav-item[aria-current="page"] {
    background-color: rgb(254 245 255); /* purple-50 */
    color: rgb(126 34 206); /* purple-700 */
}

.sidebar-nav-item[aria-current="page"] svg {
    color: rgb(126 34 206); /* purple-700 */
}
</style>

<script>
// Mobile sidebar toggle functions
function openMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    sidebar.classList.remove('-translate-x-full');
    backdrop.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const backdrop = document.getElementById('sidebar-backdrop');
    sidebar.classList.add('-translate-x-full');
    backdrop.classList.add('hidden');
    document.body.style.overflow = '';
}

// Close sidebar on navigation (for mobile)
document.querySelectorAll('#sidebar .nav-item').forEach(function(item) {
    item.addEventListener('click', function() {
        // On mobile, close sidebar after navigation
        if (window.innerWidth < 1024) {
            closeMobileSidebar();
        }
    });
});

// Handle responsive sidebar state persistence
function initSidebarState() {
    const sidebar = document.getElementById('sidebar');
    const isMobile = window.innerWidth < 1024;

    if (isMobile) {
        sidebar.classList.add('-translate-x-full');
    } else {
        sidebar.classList.remove('-translate-x-full');
    }
}

// Initialize on page load
initSidebarState();

// Re-initialize on resize
let resizeTimeout;
window.addEventListener('resize', function() {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(initSidebarState, 100);
});

// Persist sidebar state in localStorage (mobile only)
function saveSidebarState(isOpen) {
    if (window.innerWidth < 1024) {
        localStorage.setItem('sidebar_open', isOpen ? 'true' : 'false');
    }
}

function loadSidebarState() {
    if (window.innerWidth < 1024) {
        const saved = localStorage.getItem('sidebar_open');
        if (saved === 'true') {
            openMobileSidebar();
        }
    }
}

// Load saved state on page load
loadSidebarState();

// Save state on toggle
document.getElementById('hamburger-btn').addEventListener('click', function() {
    const sidebar = document.getElementById('sidebar');
    const isOpen = !sidebar.classList.contains('-translate-x-full');
    saveSidebarState(!isOpen);
});
</script>
{% endblock %}

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Dashboard</h1>
                <p class="mt-1 text-sm text-gray-500">Bienvenido, {{ user.email }}</p>
            </div>
            <a href="/dashboard/analytics"
               class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-700 hover:to-pink-700 transition-all shadow-sm">
                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                </svg>
                Analíticas
            </a>
        </div>
    </div>

    <!-- Main Grid: Accounts + Post Form (only if has accounts) -->
    <div id="main-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-6 hidden">
        <!-- Accounts Section -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Cuentas Conectadas</h2>
            <div id="accounts-section">
                <div class="text-center py-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto"></div>
                </div>
            </div>
        </div>

        <!-- Post Form Section -->
        <div class="bg-white rounded-lg shadow p-6">
            <h2 class="text-lg font-semibold text-gray-900 mb-4">Crear Publicación</h2>
            <div id="post-form-section">
                {% include "dashboard/post_form.html" %}
            </div>
        </div>
    </div>

    <!-- No Accounts: Full width accounts section -->
    <div id="no-accounts-section" class="bg-white rounded-lg shadow p-6 hidden">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">Cuentas Conectadas</h2>
        <div id="accounts-section-no-accounts">
            <div class="text-center py-4">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto"></div>
            </div>
        </div>
    </div>

    <!-- Analytics Section -->
    <div id="analytics-wrapper" class="mt-6 hidden">
        <!-- Account-level analytics -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-900">Analíticas de la Cuenta</h2>
                <div class="flex items-center space-x-2">
                    <span id="analytics-cache-status" class="text-xs text-gray-500"></span>
                    <button id="analytics-retry-btn" class="hidden inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-purple-100 text-purple-700 hover:bg-purple-200 transition-colors" onclick="retryAccountAnalytics()">
                        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Reintentar
                    </button>
                </div>
            </div>
            <div id="analytics-account-content">
                <!-- Skeleton loading placeholders -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
                        <div class="h-8 bg-gray-300 rounded w-20"></div>
                    </div>
                    <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-12 mb-2"></div>
                        <div class="h-8 bg-gray-300 rounded w-16"></div>
                    </div>
                    <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
                        <div class="h-8 bg-gray-300 rounded w-14"></div>
                    </div>
                    <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                        <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
                        <div class="h-8 bg-gray-300 rounded w-16"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- History Section -->
    <div id="history-wrapper" class="mt-6 bg-white rounded-lg shadow p-6 hidden">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-gray-900">Historial de Publicaciones</h2>
            <div class="flex items-center space-x-2">
                <span id="sse-status-dot" class="w-2.5 h-2.5 rounded-full bg-gray-400"></span>
                <span id="sse-status-text" class="text-xs text-gray-500">Conectando...</span>
            </div>
        </div>
        <div id="history-section">
            <div class="text-center py-8">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto"></div>
                <p class="mt-2 text-sm text-gray-500">Cargando publicaciones...</p>
            </div>
        </div>
    </div>
</div>

<!-- Media Analytics Modal -->
<div id="media-analytics-modal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black bg-opacity-60" onclick="closeMediaAnalyticsModal()">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full mx-4 p-6 relative" onclick="event.stopPropagation()">
        <button onclick="closeMediaAnalyticsModal()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
        <h3 class="text-lg font-semibold text-gray-900 mb-4">Analíticas de la Publicación</h3>
        <div id="media-analytics-content">
            <!-- Loading skeleton -->
            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-12 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-10 mx-auto"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-14 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-12 mx-auto"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-10 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-8 mx-auto"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-10 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-8 mx-auto"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-10 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-8 mx-auto"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-3 animate-pulse text-center">
                    <div class="h-3 bg-gray-200 rounded w-16 mx-auto mb-2"></div>
                    <div class="h-6 bg-gray-300 rounded w-12 mx-auto"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Lightbox overlay -->
<div id="lightbox" class="hidden fixed inset-0 z-50 items-center justify-center bg-black bg-opacity-80 cursor-pointer" onclick="closeLightbox()">
    <div class="relative max-w-4xl max-h-[90vh] mx-4">
        <img id="lightbox-img" src="" alt="Full size image" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl" onclick="event.stopPropagation()">
    </div>
</div>

<script>
async function loadAccounts() {
    try {
        const response = await fetch('/dashboard/accounts');
        if (!response.ok) {
            if (response.status === 401) {
                window.location.href = '/auth/login';
                return;
            }
            throw new Error('Error cargando cuentas');
        }
        const data = await response.json();
        renderDashboard(data.accounts);
    } catch (error) {
        document.getElementById('accounts-section').innerHTML = `
            <div class="text-center py-4 text-red-500">
                Error cargando cuentas
            </div>
        `;
        document.getElementById('accounts-section-no-accounts').innerHTML = `
            <div class="text-center py-4 text-red-500">
                Error cargando cuentas
            </div>
        `;
    }
}

function renderDashboard(accounts) {
    const hasAccounts = accounts && accounts.length > 0;
    const mainGrid = document.getElementById('main-grid');
    const noAccountsSection = document.getElementById('no-accounts-section');
    const historyWrapper = document.getElementById('history-wrapper');

    if (hasAccounts) {
        // Show main grid with accounts + post form
        mainGrid.classList.remove('hidden');
        noAccountsSection.classList.add('hidden');
        historyWrapper.classList.remove('hidden');
        
        renderAccounts(accounts);
    } else {
        // Show only accounts section prompting to connect
        mainGrid.classList.add('hidden');
        noAccountsSection.classList.remove('hidden');
        historyWrapper.classList.add('hidden');
        
        renderAccountsNoAccounts();
    }
}

function renderAccounts(accounts) {
    const container = document.getElementById('accounts-section');
    container.innerHTML = `
        <div class="space-y-3">
            ${accounts.map(account => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-sm font-medium text-gray-900">${account.username || account.instagram_account_id}</p>
                            <p class="text-xs text-gray-500">${account.is_active ? 'Conectada' : 'Token expirado'}</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2">
                        ${account.is_active
                            ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">Activa</span>`
                            : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">Inactiva</span>
                               <form method="POST" action="/dashboard/accounts/reconnect" class="inline">
                                   <button type="submit" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800 hover:bg-purple-200 transition-colors">Reconectar</button>
                               </form>`
                        }
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function renderAccountsNoAccounts() {
    const container = document.getElementById('accounts-section-no-accounts');
    container.innerHTML = `
        <div class="text-center py-8">
            <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">Sin cuentas conectadas</h3>
            <p class="mt-2 text-sm text-gray-500">Conecta tu primera cuenta de Instagram para comenzar a publicar contenido.</p>
            <div class="mt-6">
                <a href="/auth/instagram/login"
                   class="inline-flex items-center px-6 py-3 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                    <svg class="-ml-1 mr-2 h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/>
                    </svg>
                    Conectar Cuenta de Instagram
                </a>
            </div>
        </div>
    `;
}

async function loadPosts() {
    try {
        const response = await fetch('/dashboard/posts/feed');
        if (!response.ok) {
            if (response.status === 401) {
                window.location.href = '/auth/login';
                return;
            }
            throw new Error('Error cargando publicaciones');
        }
        const data = await response.json();
        renderPosts(data.posts);
    } catch (error) {
        document.getElementById('history-section').innerHTML = `
            <div class="text-center py-8 text-red-500">
                Error cargando publicaciones
            </div>
        `;
    }
}

function renderPosts(posts) {
    const container = document.getElementById('history-section');
    if (!posts || posts.length === 0) {
        container.innerHTML = `
            <div class="text-center py-12">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">Sin publicaciones</h3>
                <p class="mt-1 text-sm text-gray-500">Crea tu primera publicación para comenzar.</p>
            </div>
        `;
        return;
    }

    const statusLabels = {
        'pending': { label: 'Pendiente', class: 'bg-yellow-100 text-yellow-800' },
        'processing': { label: 'Procesando', class: 'bg-blue-100 text-blue-800' },
        'retrying': { label: 'Reintentando...', class: 'bg-orange-100 text-orange-800' },
        'published': { label: 'Publicado', class: 'bg-green-100 text-green-800' },
        'failed': { label: 'Fallido', class: 'bg-red-100 text-red-800' }
    };

    container.innerHTML = `
        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Imagen</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fecha</th>
                        <th scope="col" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    ${posts.map(post => {
                        const status = statusLabels[post.status] || statusLabels['pending'];
                        const date = new Date(post.created_at).toLocaleString('es-ES', { 
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                        });
                        const displayUrl = post.thumbnail_url || post.full_image_url;
                        const fullUrl = post.full_image_url || post.thumbnail_url;
                        const thumbnail = displayUrl
                            ? `<img src="${displayUrl}" alt="Thumbnail" class="w-12 h-12 rounded-lg object-cover cursor-pointer hover:opacity-80 transition-opacity" data-full-url="${fullUrl}" onclick="openLightbox(this.dataset.fullUrl)">`
                            : `<div class="w-12 h-12 bg-gray-200 rounded-lg flex items-center justify-center">
                                   <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                       <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                                   </svg>
                               </div>`;
                        
                        // Error message display for failed/retrying posts
                        let statusCell = `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${status.class}">${status.label}</span>`;
                        if (post.error_message && (post.status === 'failed' || post.status === 'retrying')) {
                            statusCell = `
                                <div class="relative group">
                                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${status.class} cursor-help" title="${post.error_message}">
                                        ${status.label}
                                        <svg class="w-3 h-3 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                        </svg>
                                    </span>
                                    <div class="hidden group-hover:block absolute left-0 bottom-full mb-2 w-64 p-2 bg-gray-900 text-white text-xs rounded shadow-lg z-10">
                                        ${post.error_message}
                                    </div>
                                </div>
                            `;
                        }
                        
                        // Retry button for failed posts / Analytics button for published posts
                        let actionsCell = '<td class="px-4 py-4 whitespace-nowrap"></td>';
                        if (post.status === 'failed') {
                            actionsCell = `
                                <td class="px-4 py-4 whitespace-nowrap">
                                    <button
                                        onclick="retryPost(${post.id}, this)"
                                        class="inline-flex items-center justify-center px-3 py-1.5 rounded-full text-xs font-semibold bg-red-600 text-white hover:bg-red-700 active:bg-red-800 transition-colors shadow-sm cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-red-600"
                                    >
                                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                                        </svg>
                                        Reintentar
                                    </button>
                                </td>
                            `;
                        } else if (post.status === 'published') {
                            actionsCell = `
                                <td class="px-4 py-4 whitespace-nowrap">
                                    <button
                                        onclick="openMediaAnalytics(${post.id})"
                                        class="inline-flex items-center justify-center px-3 py-1.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-700 hover:bg-blue-200 transition-colors cursor-pointer"
                                    >
                                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                        </svg>
                                        Analíticas
                                    </button>
                                </td>
                            `;
                        }
                        
                        return `
                            <tr>
                                <td class="px-4 py-4 whitespace-nowrap">${thumbnail}</td>
                                <td class="px-4 py-4">
                                    <div class="text-sm text-gray-900 truncate max-w-xs">
                                        ${post.caption ? (post.caption.length > 100 ? post.caption.substring(0, 100) + '...' : post.caption) : '<span class="text-gray-400 italic">Sin descripción</span>'}
                                    </div>
                                </td>
                                <td class="px-4 py-4 whitespace-nowrap">${statusCell}</td>
                                <td class="px-4 py-4 whitespace-nowrap text-sm text-gray-500">${date}</td>
                                ${actionsCell}
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        </div>

// Retry failed post handler with cooldown logic
const retryFailureCounts = {};

async function retryPost(postId, button) {
    if (button.disabled) return;
    
    button.disabled = true;
    button.innerHTML = `
        <svg class="w-3.5 h-3.5 mr-1.5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Reintentando...
    `;
    
    try {
        const response = await fetch(`/dashboard/posts/${postId}/retry`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
        });
        
        const data = await response.json();
        
        if (response.ok) {
            delete retryFailureCounts[postId];
            showToast('success', 'Publicación reenviada para procesamiento');
            loadPosts();
        } else {
            retryFailureCounts[postId] = (retryFailureCounts[postId] || 0) + 1;
            
            if (retryFailureCounts[postId] >= 3) {
                button.disabled = true;
                let remaining = 10;
                button.innerHTML = `
                    <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    Espera ${remaining}s...
                `;
                const cooldownInterval = setInterval(() => {
                    remaining--;
                    button.innerHTML = `
                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Espera ${remaining}s...
                    `;
                    if (remaining <= 0) {
                        clearInterval(cooldownInterval);
                        button.disabled = false;
                        button.innerHTML = `
                            <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                            Reintentar
                        `;
                    }
                }, 1000);
            } else {
                button.disabled = false;
                button.innerHTML = `
                    <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Reintentar
                `;
            }
            
            showToast('error', data.error || 'Error al reintentar la publicación');
        }
    } catch (error) {
        button.disabled = false;
        button.innerHTML = `
            <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Reintentar
        `;
        showToast('error', 'Error de conexión al reintentar');
    }
}

// Account Analytics
let accountAnalyticsCache = null;

async function loadAccountAnalytics() {
    const wrapper = document.getElementById('analytics-wrapper');
    const content = document.getElementById('analytics-account-content');
    const cacheStatus = document.getElementById('analytics-cache-status');
    const retryBtn = document.getElementById('analytics-retry-btn');

    const accounts = await fetchAccountsForAnalytics();
    if (!accounts || accounts.length === 0) {
        wrapper.classList.add('hidden');
        return;
    }

    wrapper.classList.remove('hidden');
    retryBtn.classList.add('hidden');
    cacheStatus.textContent = '';
    content.innerHTML = getSkeletonHTML();

    try {
        const response = await fetch('/dashboard/analytics/account?period=days_28');
        
        if (response.status === 401) {
            window.location.href = '/auth/login';
            return;
        }

        if (response.status === 403) {
            content.innerHTML = `
                <div class="text-center py-6">
                    <svg class="mx-auto h-10 w-10 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                    </svg>
                    <p class="mt-2 text-sm text-gray-600">Cuenta inactiva. Por favor reconecta tu cuenta de Instagram.</p>
                    <form method="POST" action="/dashboard/accounts/reconnect" class="mt-3">
                        <button type="submit" class="inline-flex items-center px-3 py-1.5 rounded-md text-sm font-medium bg-purple-600 text-white hover:bg-purple-700 transition-colors">
                            Reconectar Cuenta
                        </button>
                    </form>
                </div>
            `;
            return;
        }

        if (response.status === 400) {
            content.innerHTML = `
                <div class="text-center py-6">
                    <p class="text-sm text-gray-500">No hay cuenta de Instagram conectada.</p>
                </div>
            `;
            return;
        }

        if (!response.ok) {
            if (accountAnalyticsCache) {
                renderAccountMetrics(accountAnalyticsCache.metrics, true);
                cacheStatus.textContent = 'Datos almacenados (sin conexión)';
                cacheStatus.className = 'text-xs text-amber-600';
                retryBtn.classList.remove('hidden');
            } else {
                content.innerHTML = `
                    <div class="text-center py-6">
                        <p class="text-sm text-gray-500">Analíticas temporalmente no disponibles. Inténtalo más tarde.</p>
                        <button onclick="retryAccountAnalytics()" class="mt-2 inline-flex items-center px-3 py-1.5 rounded-md text-sm font-medium bg-purple-100 text-purple-700 hover:bg-purple-200 transition-colors">
                            Reintentar
                        </button>
                    </div>
                `;
            }
            return;
        }

        const data = await response.json();
        accountAnalyticsCache = data;

        if (data.stale) {
            cacheStatus.textContent = 'Actualizando...';
            cacheStatus.className = 'text-xs text-amber-600 animate-pulse';
        } else if (data.cached) {
            cacheStatus.textContent = `Actualizado: ${formatTimestamp(data.fetched_at)}`;
            cacheStatus.className = 'text-xs text-gray-500';
        } else {
            cacheStatus.textContent = 'Datos frescos';
            cacheStatus.className = 'text-xs text-green-600';
        }

        renderAccountMetrics(data.metrics, data.stale);

    } catch (error) {
        if (accountAnalyticsCache) {
            renderAccountMetrics(accountAnalyticsCache.metrics, true);
            cacheStatus.textContent = 'Datos almacenados (error de conexión)';
            cacheStatus.className = 'text-xs text-red-600';
            retryBtn.classList.remove('hidden');
        } else {
            content.innerHTML = `
                <div class="text-center py-6">
                    <p class="text-sm text-red-500">Error de conexión. Verifica tu red e intenta de nuevo.</p>
                </div>
            `;
        }
    }
}

// Utility Functions
function formatNumber(num) {
    if (num === null || num === undefined) return '0';
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toLocaleString('es-ES');
}

function formatTimestamp(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

async function fetchAccountsForAnalytics() {
    try {
        const response = await fetch('/dashboard/accounts');
        if (!response.ok) return [];
        const data = await response.json();
        return data.accounts || [];
    } catch {
        return [];
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    loadAccounts();
    loadPosts();
    loadAccountAnalytics();
    
    // SSE connection for real-time post updates
    let eventSource = null;
    let reconnectTimeout = null;
    const statusDot = document.getElementById('sse-status-dot');
    const statusText = document.getElementById('sse-status-text');

    function setSSEStatus(status) {
        if (status === 'connected') {
            statusDot.className = 'w-2.5 h-2.5 rounded-full bg-green-500';
            statusText.textContent = 'En vivo';
        } else if (status === 'disconnected') {
            statusDot.className = 'w-2.5 h-2.5 rounded-full bg-red-500';
            statusText.textContent = 'Desconectado';
        } else {
            statusDot.className = 'w-2.5 h-2.5 rounded-full bg-yellow-500 animate-pulse';
            statusText.textContent = 'Conectando...';
        }
    }

    function connectSSE() {
        if (eventSource) {
            eventSource.close();
        }

        setSSEStatus('connecting');
        eventSource = new EventSource('/dashboard/posts/stream');

        eventSource.addEventListener('post_update', function(event) {
            loadPosts();
            accountAnalyticsCache = null;
            loadAccountAnalytics();
        });

        eventSource.addEventListener('account_update', function(event) {
            loadAccounts();
        });

        eventSource.onopen = function() {
            setSSEStatus('connected');
        };

        eventSource.onerror = function() {
            setSSEStatus('disconnected');
            eventSource.close();
            reconnectTimeout = setTimeout(connectSSE, 3000);
        };
    }

    connectSSE();

    // Show toast based on URL query params (from OAuth redirect)
    const params = new URLSearchParams(window.location.search);
    if (params.get('success') === 'instagram_connected') {
        showToast('success', 'Cuenta de Instagram conectada exitosamente');
        window.history.replaceState({}, '', '/dashboard');
    }
    if (params.get('error') === 'instagram_auth_failed') {
        showToast('error', 'Error al conectar la cuenta de Instagram. Intenta de nuevo.');
        window.history.replaceState({}, '', '/dashboard');
    }
});

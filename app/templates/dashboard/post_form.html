{% if success %}
<div class="rounded-md bg-green-50 p-4 mb-4">
    <div class="flex">
        <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium text-green-800">
                Publicación creada exitosamente. Estado: {{ post.status.value | upper }}
            </p>
        </div>
    </div>
</div>
{% endif %}

{% if error %}
<div class="rounded-md bg-red-50 p-4 mb-4">
    <div class="flex">
        <div class="flex-shrink-0">
            <svg class="h-5 w-5 text-red-400" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
            </svg>
        </div>
        <div class="ml-3">
            <p class="text-sm font-medium text-red-800">{{ error }}</p>
        </div>
    </div>
</div>
{% endif %}

<form id="post-form" class="space-y-4">
    
    <!-- Image Upload -->
    <div>
        <label for="file" class="block text-sm font-medium text-gray-700 mb-1">
            Imagen <span class="text-red-500">*</span>
        </label>
        <div id="drop-zone" class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-purple-400 transition-colors">
            <div id="upload-placeholder" class="space-y-1 text-center">
                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <div class="flex text-sm text-gray-600">
                    <label for="file" class="relative cursor-pointer bg-white rounded-md font-medium text-purple-600 hover:text-purple-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-purple-500">
                        <span>Subir archivo</span>
                        <input id="file" name="file" type="file" accept="image/*" class="sr-only" required onchange="previewImage(this)">
                    </label>
                    <p class="pl-1">o arrastrar aquí</p>
                </div>
                <p class="text-xs text-gray-500">PNG, JPG, GIF hasta 10MB</p>
            </div>
            <div id="image-preview" class="hidden w-full">
                <div class="relative inline-block">
                    <img id="preview-img" src="" alt="Preview" class="max-h-64 mx-auto rounded-lg shadow-md">
                    <button type="button" onclick="removeImage()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 hover:bg-red-600">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <p id="file-name" class="mt-2 text-sm text-gray-600 text-center"></p>
            </div>
        </div>
    </div>

    <!-- Caption -->
    <div>
        <label for="caption" class="block text-sm font-medium text-gray-700 mb-1">
            Descripción
        </label>
        <textarea id="caption" name="caption" rows="3"
                  class="shadow-sm focus:ring-purple-500 focus:border-purple-500 block w-full sm:text-sm border-gray-300 rounded-md"
                  placeholder="Escribe una descripción para tu publicación..."></textarea>
        <p class="mt-1 text-xs text-gray-500">Opcional. La descripción puede estar vacía.</p>
    </div>

    <!-- Submit Button -->
    <div>
        <button type="submit" id="submit-btn"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 min-h-[44px]">
            Publicar
        </button>
    </div>
</form>

<script>
function previewImage(input) {
    if (input.files && input.files[0]) {
        const file = input.files[0];
        
        // Validate it's an image
        if (!file.type.startsWith('image/')) {
            showToast('error', 'Por favor selecciona una imagen válida');
            return;
        }
        
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('preview-img').src = e.target.result;
            document.getElementById('file-name').textContent = file.name;
            document.getElementById('upload-placeholder').classList.add('hidden');
            document.getElementById('image-preview').classList.remove('hidden');
        };
        reader.readAsDataURL(file);
    }
}

function removeImage() {
    const input = document.getElementById('file');
    input.value = '';
    document.getElementById('preview-img').src = '';
    document.getElementById('file-name').textContent = '';
    document.getElementById('upload-placeholder').classList.remove('hidden');
    document.getElementById('image-preview').classList.add('hidden');
}

function clearPostForm() {
    document.getElementById('post-form').reset();
    removeImage();
}

// Drag and drop support
const dropZone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file');

dropZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.add('border-purple-400', 'bg-purple-50');
});

dropZone.addEventListener('dragleave', function(e) {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('border-purple-400', 'bg-purple-50');
});

dropZone.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    dropZone.classList.remove('border-purple-400', 'bg-purple-50');
    
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
            fileInput.files = e.dataTransfer.files;
            previewImage(fileInput);
        } else {
            showToast('error', 'Por favor selecciona una imagen');
        }
    }
});

// Form submission via AJAX
document.getElementById('post-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    e.stopPropagation();
    
    const form = this;
    const submitBtn = document.getElementById('submit-btn');
    const fileInput = document.getElementById('file');
    const caption = document.getElementById('caption');
    
    // Validate file
    if (!fileInput.files || !fileInput.files[0]) {
        showToast('error', 'Selecciona una imagen');
        return;
    }
    
    // Disable button
    submitBtn.disabled = true;
    submitBtn.textContent = 'Publicando...';
    
    try {
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        formData.append('caption', caption.value);
        
        const response = await fetch('/dashboard/post', {
            method: 'POST',
            body: formData
        });
        
        const data = await response.json();
        
        if (response.ok && data.success) {
            showToast('success', 'Publicación creada exitosamente');
            clearPostForm();
            // Refresh posts feed
            if (typeof loadPosts === 'function') {
                loadPosts();
            }
        } else {
            showToast('error', data.error || 'Error al crear la publicación');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Publicar';
        }
    } catch (error) {
        console.error('Error:', error);
        showToast('error', 'Error de conexión');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publicar';
    }
});
</script>

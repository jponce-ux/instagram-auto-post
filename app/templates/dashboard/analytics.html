{% extends "app_layout.html" %}

{% block title %}Analíticas Detalladas - Mi App{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8 gap-4">
        <div class="flex items-center space-x-3">
            <a href="/dashboard" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Dashboard
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Analíticas Detalladas</h1>
        </div>

        <!-- Period Selector with HTMX -->
        <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1"
             hx-get="/dashboard/analytics"
             hx-trigger="none"
             hx-swap="none">
            <button id="period-daily"
                    onclick="changePeriod('days_1')"
                    class="px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900 {% if period == 'days_1' %}bg-white shadow-sm text-gray-900{% endif %}">
                Diario
            </button>
            <button id="period-weekly"
                    onclick="changePeriod('days_7')"
                    class="px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900 {% if period == 'days_7' %}bg-white shadow-sm text-gray-900{% endif %}">
                Semanal
            </button>
            <button id="period-monthly"
                    onclick="changePeriod('days_28')"
                    class="px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900 {% if period == 'days_28' or not period %}bg-white shadow-sm text-gray-900{% endif %}">
                Mensual
            </button>
        </div>
    </div>

    <!-- Main Analytics Grid -->
    <div id="analytics-main" class="space-y-6">
        <!-- KPI Cards Section -->
        <div id="kpi-cards-section"
             hx-get="/dashboard/analytics/kpis"
             hx-target="#kpi-cards-section"
             hx-swap="innerHTML"
             hx-trigger="filterChanged from:body"
             hx-vals='{"period": "{{ period | default("days_28") }}"}'>
            <!-- Loading skeleton -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                    <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
                    <div class="h-8 bg-gray-300 rounded w-16"></div>
                    <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                    <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
                    <div class="h-8 bg-gray-300 rounded w-14"></div>
                    <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
                </div>
                <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
                    <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
                    <div class="h-8 bg-gray-300 rounded w-12"></div>
                    <div class="h-4 bg-gray-200 rounded w-10 mt-2"></div>
                </div>
            </div>
        </div>

        <!-- Charts Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Reach Chart -->
            <div id="reach-chart-section"
                 hx-get="/dashboard/analytics/reach-chart"
                 hx-target="#reach-chart-section"
                 hx-swap="innerHTML"
                 hx-trigger="filterChanged from:body"
                 hx-vals='{"period": "{{ period | default("days_28") }}"}'>
                <!-- Loading skeleton -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="h-6 bg-gray-200 rounded w-32 mb-4"></div>
                    <div class="h-64 bg-gray-100 rounded animate-pulse"></div>
                </div>
            </div>

            <!-- Growth Chart -->
            <div id="growth-chart-section"
                 hx-get="/dashboard/analytics/growth-chart"
                 hx-target="#growth-chart-section"
                 hx-swap="innerHTML"
                 hx-trigger="filterChanged from:body"
                 hx-vals='{"period": "{{ period | default("days_28") }}"}'>
                <!-- Loading skeleton -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="h-6 bg-gray-200 rounded w-40 mb-4"></div>
                    <div class="h-64 bg-gray-100 rounded animate-pulse"></div>
                </div>
            </div>
        </div>

        <!-- Top Content Grid -->
        <div id="top-content-section"
             hx-get="/dashboard/analytics/top-content"
             hx-target="#top-content-section"
             hx-swap="innerHTML"
             hx-trigger="filterChanged from:body"
             hx-vals='{"period": "{{ period | default("days_28") }}"}'>
            <!-- Loading skeleton -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="h-6 bg-gray-200 rounded w-32 mb-4"></div>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <div class="aspect-square bg-gray-100 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-100 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-100 rounded-lg animate-pulse"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Post Analytics Modal Container -->
<div id="post-modal-content"></div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>
// Global chart instances
window.reachChartInstance = null;
window.growthChartInstance = null;

let currentPeriod = '{{ period | default("days_28") }}';

// Period change handler with HTMX
function changePeriod(period) {
    if (period === currentPeriod) return;

    currentPeriod = period;

    // Update button styles
    document.getElementById('period-daily').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all ' + (period === 'days_1' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-600 hover:text-gray-900');
    document.getElementById('period-weekly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all ' + (period === 'days_7' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-600 hover:text-gray-900');
    document.getElementById('period-monthly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all ' + (period === 'days_28' ? 'bg-white shadow-sm text-gray-900' : 'text-gray-600 hover:text-gray-900');

    // Update URL without reload
    const url = new URL(window.location.href);
    url.searchParams.set('period', period);
    window.history.replaceState({}, '', url);

    // Trigger HTMX swap on all analytics sections
    document.body.dispatchEvent(new CustomEvent('filterChanged', { detail: { period } }));
}

// Post modal handlers
function openPostModal(postId) {
    htmx.ajax('GET', `/dashboard/analytics/media/${postId}`, {
        target: '#post-modal-content',
        swap: 'innerHTML',
        afterSwap: function() {
            const modal = document.getElementById('post-analytics-modal');
            if (modal) {
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                document.body.classList.add('overflow-hidden');
            }
        }
    });
}

function closePostModal() {
    const modal = document.getElementById('post-analytics-modal');
    if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.body.classList.remove('overflow-hidden');
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', function() {
    // Read initial period from URL query params
    const params = new URLSearchParams(window.location.search);
    const urlPeriod = params.get('period') || 'days_28';

    // Set initial button state
    currentPeriod = urlPeriod;
    if (urlPeriod === 'days_1') {
        document.getElementById('period-daily').className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
        document.getElementById('period-weekly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
        document.getElementById('period-monthly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
    } else if (urlPeriod === 'days_7') {
        document.getElementById('period-weekly').className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
        document.getElementById('period-daily').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
        document.getElementById('period-monthly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
    } else {
        document.getElementById('period-monthly').className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
        document.getElementById('period-daily').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
        document.getElementById('period-weekly').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
    }

    // Initial data load via HTMX
    document.body.dispatchEvent(new CustomEvent('filterChanged', { detail: { period: urlPeriod } }));

    // Modal close handlers
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closePostModal();
        }
    });

    // Close modal on backdrop click
    document.addEventListener('click', function(e) {
        const modal = document.getElementById('post-analytics-modal');
        if (modal && e.target === modal) {
            closePostModal();
        }
    });
});

// HTMX event handlers for after swap
document.body.addEventListener('htmx:afterSwap', function(evt) {
    // Reinitialize charts after partial swap if canvas elements exist
    if (evt.detail.target.id === 'reach-chart-section') {
        initReachChart();
    } else if (evt.detail.target.id === 'growth-chart-section') {
        initGrowthChart();
    }
});

function initReachChart() {
    const canvas = document.getElementById('reachChart');
    if (!canvas || !canvas.dataset.labels || !canvas.dataset.data) return;

    const labels = JSON.parse(canvas.dataset.labels);
    const data = JSON.parse(canvas.dataset.data);

    if (labels.length === 0 || data.length === 0) return;

    const ctx = canvas.getContext('2d');

    if (window.reachChartInstance) {
        window.reachChartInstance.destroy();
    }

    window.reachChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels.map(d => {
                const date = new Date(d + 'T00:00:00');
                return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
            }),
            datasets: [{
                label: 'Alcance',
                data: data,
                borderColor: '#8B5CF6',
                backgroundColor: 'rgba(139, 92, 246, 0.1)',
                tension: 0.3,
                fill: true,
                pointRadius: 3,
                pointHoverRadius: 5,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            return context.parsed.y.toLocaleString('es-ES');
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: {
                        font: { size: 11 },
                        maxRotation: 45,
                        autoSkip: true,
                        maxTicksLimit: 10
                    }
                },
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0, 0, 0, 0.05)' },
                    ticks: {
                        font: { size: 11 },
                        callback: function(value) {
                            if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                            if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                            return value;
                        }
                    }
                }
            }
        }
    });
}

function initGrowthChart() {
    const canvas = document.getElementById('growthChart');
    if (!canvas || !canvas.dataset.labels || !canvas.dataset.data) return;

    const labels = JSON.parse(canvas.dataset.labels);
    const data = JSON.parse(canvas.dataset.data);

    if (labels.length === 0 || data.length === 0) return;

    const ctx = canvas.getContext('2d');

    if (window.growthChartInstance) {
        window.growthChartInstance.destroy();
    }

    const INDUSTRY_BENCHMARK = 100;
    const benchmarkData = labels.map(() => INDUSTRY_BENCHMARK);

    window.growthChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                {
                    label: 'Tu crecimiento',
                    data: data,
                    backgroundColor: data.map(v => v >= 0 ? '#10B981' : '#EF4444'),
                    borderRadius: 4,
                },
                {
                    label: 'Promedio industria',
                    data: benchmarkData,
                    type: 'line',
                    borderColor: '#EF4444',
                    borderDash: [5, 5],
                    fill: false,
                    pointRadius: 0,
                    tension: 0,
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            if (context.datasetIndex === 0) {
                                const value = context.parsed.y;
                                return `Tu crecimiento: ${value >= 0 ? '+' : ''}${value.toLocaleString('es-ES')}`;
                            }
                            return `Promedio industria: ${context.parsed.y}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    grid: { display: false },
                    ticks: { font: { size: 11 } }
                },
                y: {
                    beginAtZero: true,
                    grid: { color: 'rgba(0, 0, 0, 0.05)' },
                    ticks: {
                        font: { size: 11 },
                        callback: function(value) {
                            if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                            return value;
                        }
                    }
                }
            }
        }
    });
}
</script>
{% endblock %}

{% extends "base.html" %}

{% block title %}Analíticas - Mi App{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between mb-8 gap-4">
        <div class="flex items-center space-x-3">
            <a href="/dashboard" class="inline-flex items-center text-sm text-gray-500 hover:text-gray-700 transition-colors">
                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                Dashboard
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Analíticas</h1>
        </div>

        <!-- Period Selector -->
        <div class="flex items-center space-x-2 bg-gray-100 rounded-lg p-1">
            <button id="period-7d" onclick="changePeriod('days_7')" class="px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900">
                7 días
            </button>
            <button id="period-28d" onclick="changePeriod('days_28')" class="px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900">
                28 días
            </button>
        </div>
    </div>

    <!-- Cache Status + Retry -->
    <div class="flex items-center justify-between mb-4">
        <span id="analytics-cache-status" class="text-xs text-gray-500"></span>
        <button id="analytics-retry-btn" class="hidden inline-flex items-center px-2.5 py-1 rounded-md text-xs font-medium bg-purple-100 text-purple-700 hover:bg-purple-200 transition-colors" onclick="retryAnalytics()">
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            Reintentar
        </button>
    </div>

    <!-- Summary Cards -->
    <div id="summary-cards" class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
        <!-- Skeleton loading placeholders -->
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-20"></div>
            <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-16"></div>
            <div class="h-4 bg-gray-200 rounded w-14 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-14"></div>
            <div class="h-4 bg-gray-200 rounded w-10 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-16"></div>
            <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
        </div>
    </div>

    <!-- Timeline Chart -->
    <div class="bg-white rounded-lg shadow p-6 mb-8">
        <h2 class="text-lg font-semibold text-gray-900 mb-4">Rendimiento en el Tiempo</h2>
        <div id="chart-wrapper" class="relative" style="height: 350px;">
            <!-- Chart skeleton -->
            <div id="chart-skeleton" class="absolute inset-0 bg-gray-100 rounded-lg animate-pulse flex items-center justify-center">
                <div class="text-center">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600 mx-auto"></div>
                    <p class="mt-2 text-sm text-gray-500">Cargando gráfico...</p>
                </div>
            </div>
            <canvas id="analytics-chart"></canvas>
        </div>
        <p id="chart-no-data" class="hidden text-center text-sm text-gray-500 mt-4">Sin actividad registrada en este período.</p>
    </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>

<script>
// ============================================================
// Analytics Page State
// ============================================================

let currentPeriod = 'days_28';
let analyticsData = null;
let analyticsChart = null;
let fetchAbortController = null;
let debounceTimer = null;

// ============================================================
// Fetch Analytics Data
// ============================================================

async function fetchAnalytics(period) {
    const retryBtn = document.getElementById('analytics-retry-btn');
    const cacheStatus = document.getElementById('analytics-cache-status');

    retryBtn.classList.add('hidden');
    cacheStatus.textContent = '';

    // Cancel any in-flight request
    if (fetchAbortController) {
        fetchAbortController.abort();
    }
    fetchAbortController = new AbortController();

    // Show skeleton loading
    showSkeletonLoading();

    try {
        const response = await fetch(`/dashboard/analytics/account?period=${period}`, {
            signal: fetchAbortController.signal,
        });

        if (response.status === 401) {
            window.location.href = '/auth/login';
            return;
        }

        if (response.status === 403) {
            showAccountInactiveState();
            return;
        }

        if (response.status === 400) {
            showNoAccountState();
            return;
        }

        if (!response.ok) {
            // API error — show stale data or error
            if (analyticsData && analyticsData.cached) {
                renderSummaryCards(analyticsData.metrics, analyticsData.trends);
                renderTimelineChart(analyticsData.timeline);
                cacheStatus.textContent = 'Datos almacenados (sin conexión)';
                cacheStatus.className = 'text-xs text-amber-600';
                retryBtn.classList.remove('hidden');
            } else {
                showApiUnavailableState();
            }
            return;
        }

        const data = await response.json();
        analyticsData = data;

        // Update cache status
        if (data.stale) {
            cacheStatus.textContent = 'Actualizando...';
            cacheStatus.className = 'text-xs text-amber-600 animate-pulse';
        } else if (data.cached) {
            cacheStatus.textContent = `Actualizado: ${formatTimestamp(data.fetched_at)}`;
            cacheStatus.className = 'text-xs text-gray-500';
        } else {
            cacheStatus.textContent = 'Datos frescos';
            cacheStatus.className = 'text-xs text-green-600';
        }

        // Render data
        renderSummaryCards(data.metrics, data.trends);
        renderTimelineChart(data.timeline);

    } catch (error) {
        if (error.name === 'AbortError') {
            // Request was cancelled — do nothing
            return;
        }

        if (analyticsData && analyticsData.cached) {
            renderSummaryCards(analyticsData.metrics, analyticsData.trends);
            renderTimelineChart(analyticsData.timeline);
            cacheStatus.textContent = 'Datos almacenados (error de conexión)';
            cacheStatus.className = 'text-xs text-red-600';
            retryBtn.classList.remove('hidden');
        } else {
            showApiUnavailableState();
        }
    }
}

// ============================================================
// Render Summary Cards with Trend Indicators
// ============================================================

function renderSummaryCards(metrics, trends) {
    const container = document.getElementById('summary-cards');

    const metricCards = [
        { label: 'Alcance', value: metrics.reach, trend: trends?.reach, icon: 'users' },
        { label: 'Interacciones', value: metrics.total_interactions, trend: trends?.total_interactions, icon: 'eye' },
        { label: 'Visitas al Perfil', value: metrics.profile_views, trend: trends?.profile_views, icon: 'user' },
        { label: 'Seguidores', value: metrics.follower_count, trend: trends?.follower_count, icon: 'heart' },
    ];

    container.innerHTML = metricCards.map(card => `
        <div class="bg-white rounded-lg shadow p-4 hover:shadow-md transition-shadow"
             role="region"
             aria-label="${card.label}: ${formatNumber(card.value)}">
            <div class="flex items-center space-x-2 mb-2">
                ${getMetricIcon(card.icon)}
                <span class="text-xs font-medium text-gray-500 uppercase tracking-wide">${card.label}</span>
            </div>
            <p class="text-2xl font-bold text-gray-900">${formatNumber(card.value)}</p>
            <div class="mt-1">${renderTrendIndicator(card.trend)}</div>
        </div>
    `).join('');
}

// ============================================================
// Render Trend Indicator
// ============================================================

function renderTrendIndicator(trendValue) {
    if (trendValue === null || trendValue === undefined) {
        return `<span class="text-xs text-gray-400">—</span>`;
    }

    if (trendValue > 0) {
        return `
            <span class="inline-flex items-center text-xs font-medium text-green-600" title="Aumento del ${trendValue.toFixed(1)}%">
                <svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                </svg>
                +${trendValue.toFixed(1)}%
            </span>
        `;
    } else if (trendValue < 0) {
        return `
            <span class="inline-flex items-center text-xs font-medium text-red-600" title="Disminución del ${Math.abs(trendValue).toFixed(1)}%">
                <svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"/>
                </svg>
                ${trendValue.toFixed(1)}%
            </span>
        `;
    } else {
        return `
            <span class="inline-flex items-center text-xs font-medium text-gray-400" title="Sin cambio">
                <svg class="w-3 h-3 mr-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"/>
                </svg>
                0.0%
            </span>
        `;
    }
}

// ============================================================
// Render Timeline Chart (Chart.js)
// ============================================================

function renderTimelineChart(timelineData) {
    const skeleton = document.getElementById('chart-skeleton');
    const noDataMsg = document.getElementById('chart-no-data');

    if (!timelineData || !timelineData.labels || timelineData.labels.length === 0) {
        skeleton.classList.add('hidden');
        noDataMsg.classList.remove('hidden');
        return;
    }

    noDataMsg.classList.add('hidden');
    skeleton.classList.add('hidden');

    const labels = timelineData.labels.map(d => {
        const date = new Date(d + 'T00:00:00');
        return date.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
    });

    const datasets = timelineData.datasets || {};

    // Check if all values are zero
    const allZero = Object.values(datasets).every(arr => arr.every(v => v === 0));
    if (allZero) {
        noDataMsg.classList.remove('hidden');
    }

    // Destroy existing chart if present
    if (analyticsChart) {
        analyticsChart.destroy();
    }

    const ctx = document.getElementById('analytics-chart').getContext('2d');

    const chartDatasets = [];

    const metricConfig = [
        { key: 'total_interactions', label: 'Interacciones', color: 'rgba(147, 51, 234, 1)', bg: 'rgba(147, 51, 234, 0.1)' },
        { key: 'reach', label: 'Alcance', color: 'rgba(59, 130, 246, 1)', bg: 'rgba(59, 130, 246, 0.1)' },
        { key: 'profile_views', label: 'Visitas al Perfil', color: 'rgba(34, 197, 94, 1)', bg: 'rgba(34, 197, 94, 0.1)' },
        { key: 'follower_count', label: 'Seguidores', color: 'rgba(236, 72, 153, 1)', bg: 'rgba(236, 72, 153, 0.1)' },
    ];

    for (const config of metricConfig) {
        const data = datasets[config.key];
        if (data && data.length > 0) {
            chartDatasets.push({
                label: config.label,
                data: data,
                borderColor: config.color,
                backgroundColor: config.bg,
                borderWidth: 2,
                pointRadius: 3,
                pointHoverRadius: 5,
                tension: 0.3,
                fill: false,
            });
        }
    }

    analyticsChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: chartDatasets,
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
                mode: 'index',
                intersect: false,
            },
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        usePointStyle: true,
                        pointStyle: 'circle',
                        padding: 20,
                        font: { size: 12 },
                    },
                },
                tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleFont: { size: 13 },
                    bodyFont: { size: 12 },
                    padding: 12,
                    cornerRadius: 8,
                    callbacks: {
                        label: function(context) {
                            return `${context.dataset.label}: ${context.parsed.y.toLocaleString('es-ES')}`;
                        },
                    },
                },
            },
            scales: {
                x: {
                    grid: {
                        display: false,
                    },
                    ticks: {
                        font: { size: 11 },
                        maxRotation: 45,
                        autoSkip: true,
                        maxTicksLimit: 10,
                    },
                },
                y: {
                    beginAtZero: true,
                    grid: {
                        color: 'rgba(0, 0, 0, 0.05)',
                    },
                    ticks: {
                        font: { size: 11 },
                        callback: function(value) {
                            if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                            if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                            return value;
                        },
                    },
                },
            },
        },
    });
}

// ============================================================
// Period Selector (with debounce)
// ============================================================

function changePeriod(period) {
    if (period === currentPeriod) return;

    // Debounce: 300ms delay
    if (debounceTimer) {
        clearTimeout(debounceTimer);
    }

    debounceTimer = setTimeout(() => {
        currentPeriod = period;

        // Update button styles
        const btn7d = document.getElementById('period-7d');
        const btn28d = document.getElementById('period-28d');

        if (period === 'days_7') {
            btn7d.className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
            btn28d.className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
        } else {
            btn28d.className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
            btn7d.className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
        }

        fetchAnalytics(period);
    }, 300);
}

// ============================================================
// Retry Handler
// ============================================================

async function retryAnalytics() {
    const retryBtn = document.getElementById('analytics-retry-btn');
    retryBtn.disabled = true;
    retryBtn.innerHTML = `
        <svg class="w-3 h-3 mr-1 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Cargando...
    `;

    // Clear cache to force fresh fetch
    analyticsData = null;
    await fetchAnalytics(currentPeriod);

    retryBtn.disabled = false;
    retryBtn.innerHTML = `
        <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        Reintentar
    `;
}

// ============================================================
// Loading / Error States
// ============================================================

function showSkeletonLoading() {
    const container = document.getElementById('summary-cards');
    container.innerHTML = `
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-20"></div>
            <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-20 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-16"></div>
            <div class="h-4 bg-gray-200 rounded w-14 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-24 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-14"></div>
            <div class="h-4 bg-gray-200 rounded w-10 mt-2"></div>
        </div>
        <div class="bg-gray-100 rounded-lg p-4 animate-pulse">
            <div class="h-4 bg-gray-200 rounded w-16 mb-2"></div>
            <div class="h-8 bg-gray-300 rounded w-16"></div>
            <div class="h-4 bg-gray-200 rounded w-12 mt-2"></div>
        </div>
    `;

    const skeleton = document.getElementById('chart-skeleton');
    skeleton.classList.remove('hidden');
}

function showNoAccountState() {
    const container = document.getElementById('summary-cards');
    container.innerHTML = `
        <div class="col-span-2 sm:col-span-4 text-center py-12">
            <svg class="mx-auto h-16 w-16 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">Sin cuenta de Instagram conectada</h3>
            <p class="mt-2 text-sm text-gray-500">Conecta tu cuenta de Instagram para ver las analíticas de tu cuenta.</p>
            <div class="mt-6">
                <a href="/auth/instagram/login"

                    <svg class="-ml-1 mr-2 h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073z"/>

function showAccountInactiveState() {
    const container = document.getElementById('summary-cards');
    container.innerHTML = `
        <div class="col-span-2 sm:col-span-4 text-center py-12">
            <svg class="mx-auto h-12 w-12 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>

            <p class="mt-2 text-sm text-gray-500">Tu cuenta de Instagram necesita ser reconectada para ver las analíticas.</p>
            <div class="mt-6">
                <form method="POST" action="/dashboard/accounts/reconnect" class="inline">
                    <button type="submit" class="inline-flex items-center px-6 py-3 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500">
                        Reconectar Cuenta
                    </button>
                </form>

}

function showApiUnavailableState() {
    const container = document.getElementById('summary-cards');
    container.innerHTML = `
        <div class="col-span-2 sm:col-span-4 text-center py-12">
            <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <h3 class="mt-4 text-lg font-medium text-gray-900">Analíticas temporalmente no disponibles</h3>
            <p class="mt-2 text-sm text-gray-500">Inténtalo más tarde.</p>
            <button onclick="retryAnalytics()" class="mt-4 inline-flex items-center px-4 py-2 rounded-md text-sm font-medium bg-purple-100 text-purple-700 hover:bg-purple-200 transition-colors">
                Reintentar
            </button>
        </div>
    `;
    document.getElementById('chart-skeleton').classList.add('hidden');
}

// ============================================================
// Utility Functions (reused from layout.html)
// ============================================================

function formatNumber(num) {
    if (num === null || num === undefined) return '0';
    if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
    if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
    return num.toLocaleString('es-ES');
}

function formatTimestamp(isoString) {
    if (!isoString) return '';
    const date = new Date(isoString);
    return date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
}

function getMetricIcon(type) {
    const icons = {
        eye: `<svg class="w-4 h-4 text-purple-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`,

document.addEventListener('DOMContentLoaded', function() {
    // Read initial period from URL query params
    const params = new URLSearchParams(window.location.search);
    const urlPeriod = params.get('period');
    if (urlPeriod === 'days_7') {
        currentPeriod = 'days_7';
        document.getElementById('period-7d').className = 'px-4 py-1.5 text-sm font-medium rounded-md bg-white shadow-sm text-gray-900';
        document.getElementById('period-28d').className = 'px-4 py-1.5 text-sm font-medium rounded-md transition-all text-gray-600 hover:text-gray-900';
    }

    fetchAnalytics(currentPeriod);
});

// Cancel in-flight request on page unload
window.addEventListener('beforeunload', function() {
    if (fetchAbortController) {
        fetchAbortController.abort();
    }
});

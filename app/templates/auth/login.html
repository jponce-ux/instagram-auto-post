{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-900">Iniciar Sesión</h1>
            <p class="text-gray-600 mt-2">Accede a tu cuenta de Mi App Instagram</p>
        </div>
        
        <div class="bg-white shadow-md rounded-lg p-8">
            <form id="login-form" onsubmit="return handleLoginSubmit(event)">
                <div class="space-y-6">
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                            Correo electrónico
                        </label>
                        <input 
                            type="email" 
                            id="username" 
                            name="username" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="tu@email.com"
                        >
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                            Contraseña
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="••••••••"
                        >
                    </div>
                    
                    <button 
                        type="submit"
                        id="login-submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors"
                    >
                        Iniciar Sesión
                    </button>
                </div>
            </form>
            
            <p class="text-center text-gray-600 mt-6">
                ¿No tienes cuenta? 
                <a href="/auth/register" class="text-blue-600 hover:text-blue-700 font-medium">
                    Regístrate aquí
                </a>
            </p>
        </div>
    </div>
</div>

<script>
async function handleLoginSubmit(event) {
    event.preventDefault();
    
    const submitBtn = document.getElementById('login-submit');
    const formData = new FormData(document.getElementById('login-form'));
    
    submitBtn.disabled = true;
    submitBtn.textContent = 'Cargando...';
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            body: formData,
        });
        
        if (response.redirected) {
            window.location.href = response.url;
        } else if (!response.ok) {
            showToast('error', 'Correo o contraseña incorrectos');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Iniciar Sesión';
        }
    } catch (error) {
        showToast('error', 'Error de conexión. Intenta de nuevo.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar Sesión';
    }
    
    return false;
}

// Show success toast if redirected from registration
document.addEventListener('DOMContentLoaded', function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === '1') {
        showToast('success', 'Cuenta creada exitosamente. Inicia sesión.');
        window.history.replaceState({}, '', '/auth/login');
    }
});
</script>
{% endblock %}
